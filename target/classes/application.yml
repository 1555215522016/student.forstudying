# ===== 全局通用配置（所有环境都生效）=====

spring:
  application:
    name: scuplus-java

  # 默认激活哪个环境（dev=开发 / prod=生产）
  profiles:
    active: dev

  jackson:
    # 统一时间格式，避免返回 "2026-08-11T15:27:45" 这种难看格式
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  servlet:
    multipart:
      # 分片上传：单分片上限（后端中转模式，分片大小要能容纳）
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  # 抢课瞬间 ~7000 TCP 连接涌入的兜底（线程数别乱加，真正要调的是 Hikari 池）
  tomcat:
    # 处理请求的线程：峰值 3000/s × ~10ms ≈ 30 就够，默认 200 已有余量，不卷
    threads:
      max: 200
    # 内核等待队列：瞬时超出线程能力时先排队而不是直接拒绝，给 7000 人涌入留缓冲
    accept-count: 1000
    # 最大 TCP 连接数：默认 8192 已够 7000 并发，显式写 10000 留余量
    max-connections: 10000

# ===== MyBatis-Plus 全局配置 =====
mybatis-plus:
  configuration:
    # 数据库下划线字段 user_id 自动映射成 Java 驼峰属性 userId
    map-underscore-to-camel-case: true
    # 压测提醒：StdOutImpl 会把每条 SQL 打到控制台（10万次压测=同步写盘拖垮吞吐）。
    # 调试想开 SQL 日志时改成 StdOutImpl，压测务必用 NoLoggingImpl。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      # 主键策略：数据库自增
      id-type: auto

# ===== 日志 =====
logging:
  pattern:
    # [%X{traceId}] 打印 TraceIdFilter 生成的全链路 id；请求外的日志（启动等）显示为 []
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId}] %logger{36} - %msg%n"

# ===== SpringDoc / Swagger UI =====
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ===== JWT 配置（登录令牌的密钥和有效期）=====
scuplus:
  jwt:
    # 生产环境务必换成随机长字符串，用环境变量覆盖
    secret: scuplus-dev-secret-key-change-me-in-production-0123456789
    # token 有效期：单位秒，7 天
    expire-seconds: 604800
    # 请求头里携带 token 的字段名
    header: Authorization

  # ===== MinIO 对象存储配置（本地开发）=====
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: scuplus
  # 开发环境 bucket 设为公开读，上传后前端能直接访问返回的 URL
  public-read: true

  # ====ES 搜索配置  =====
elasticsearch:
  uris:http://localhost:9200

