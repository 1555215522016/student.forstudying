# ===== 开发环境配置（日常开发用）=====

spring:
  datasource:
    # 连 Docker 里的 MySQL 8，库名 scuplus
    url: jdbc:mysql://localhost:3306/scuplus?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      # 密码：本地开发 Redis 未设密码，留空

  cache:
    # 缓存实现用 Redis（配合 @Cacheable 注解）
    type: redis
