services:
  # ===== MySQL 8：业务数据库 =====
  mysql:
    image: mysql:8.0
    container_name: scuplus-mysql
    restart: unless-stopped
    environment:
      # root 密码：仅本地开发用
      MYSQL_ROOT_PASSWORD: root123456
      # 容器启动时自动创建的空库
      MYSQL_DATABASE: scuplus
      TZ: Asia/Shanghai
    ports:
      # 宿主机端口:容器端口（把容器内 MySQL 暴露到本机 3306，让 Java 程序连接）
      - "3306:3306"
    volumes:
      # 数据卷：MySQL 数据落盘，容器删除数据也不丢
      - mysql_data:/var/lib/mysql
      # 初始化脚本目录：首次启动时自动执行里面的 .sql 建表
      - ./src/main/resources/db:/docker-entrypoint-initdb.d:ro
    command:
      # 统一用 utf8mb4（支持中文和 emoji）
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 压测优化：每次提交不强制 fsync 落盘，改为每秒组提交刷一次（写入快，最多丢 1 秒数据，仅 dev/压测用）
      - --innodb-flush-log-at-trx-commit=2
    healthcheck:
      # 容器健康检查：docker compose ps 时能看容器是否就绪
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===== Redis 7：缓存 / 会话存储 =====
  redis:
    image: redis:7-alpine
    container_name: scuplus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===== MinIO：本地对象存储（图片/视频上传，兼容 OSS/S3 API）=====
  minio:
    image: minio/minio:latest
    container_name: scuplus-minio
    restart: unless-stopped
    environment:
      # 控制台登录账号密码（本地开发用）
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # 9000 = API 端口（程序连它），9001 = 管理控制台
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # ===== Elasticsearch：帖子搜索（官方镜像 + 中文分析插件）=====
  elasticsearch:
    build: ./docker/elasticsearch
    container_name: scuplus-es
    restart: unless-stopped
    environment:
      # 单节点开发模式
      - discovery.type=single-node
      # 本地开发关闭安全认证，Spring 连接不用配账号密码
      - xpack.security.enabled=false
      # 限制堆内存，避免和本机 MySQL/Redis/App 抢内存
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 30

# ===== 数据卷声明 =====
volumes:
  mysql_data:
  redis_data:
  minio_data:
  es_data:
