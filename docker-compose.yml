services:
  # ===== MySQL 8：业务数据库 =====
  mysql:
    image: mysql:8.0
    container_name: scuplus-mysql
    restart: unless-stopped
    environment:
      # root 密码：仅本地开发用
      MYSQL_ROOT_PASSWORD: root123456
      # 容器启动时自动创建的空库
      MYSQL_DATABASE: scuplus
      TZ: Asia/Shanghai
    ports:
      # 宿主机端口:容器端口（把容器内 MySQL 暴露到本机 3306，让 Java 程序连接）
      - "3306:3306"
    volumes:
      # 数据卷：MySQL 数据落盘，容器删除数据也不丢
      - mysql_data:/var/lib/mysql
      # 初始化脚本目录：首次启动时自动执行里面的 .sql 建表
      - ./src/main/resources/db:/docker-entrypoint-initdb.d:ro
    command:
      # 统一用 utf8mb4（支持中文和 emoji）
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # 容器健康检查：docker compose ps 时能看容器是否就绪
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===== Redis 7：缓存 / 会话存储 =====
  redis:
    image: redis:7-alpine
    container_name: scuplus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===== MinIO：本地对象存储（图片/视频上传，兼容 OSS/S3 API）=====
  minio:
    image: minio/minio:latest
    container_name: scuplus-minio
    restart: unless-stopped
    environment:
      # 控制台登录账号密码（本地开发用）
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # 9000 = API 端口（程序连它），9001 = 管理控制台
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

# ===== 数据卷声明 =====
volumes:
  mysql_data:
  redis_data:
  minio_data:
