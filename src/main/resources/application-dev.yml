# ===== 开发环境配置（日常开发用）=====

spring:
  datasource:
    # 连 Docker 里的 MySQL 8，库名 scuplus。用 127.0.0.1 而非 localhost：Windows 上 localhost 可能解析成 IPv6 ::1，
    # 而 Docker 端口映射绑定在 0.0.0.0（IPv4），会 Connection refused。
    url: jdbc:mysql://127.0.0.1:3306/scuplus?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver

    # Hikari 连接池：抢课峰值 ~3000 请求/s，单次 INSERT 约 2~4ms → 并发连接 ≈ 3000×0.003 ≈ 9~12 个。
    # 默认池只有 10，峰值时连接会被打满，多出的线程全堵在"等连接"上（这就是压测高延迟的主因），故调大。
    hikari:
      maximum-pool-size: 80     # 理论需 ~12，50 留 4 倍余量抗突发/GC 抖动；单机别上 100（MySQL 端也会开对应线程）
      minimum-idle: 10          # 平时保留 10 条空闲连接，冷启动/突发时不用现建
      connection-timeout: 3000  # 3s 拿不到连接就快速失败（返回业务错），绝不无限等
      max-lifetime: 1800000     # 连接存活上限 30 分钟，防 MySQL server 主动掐死超长连接

  data:
    redis:
      # 同 MySQL：用 127.0.0.1 避免 localhost 解析成 ::1 打到本机其他 Redis 进程
      host: 127.0.0.1
      port: 6379
      # 密码：本地开发 Redis 未设密码，留空

  cache:
    # 缓存实现用 Redis（配合 @Cacheable 注解）
    type: redis

# ===== 压测旁路开关（仅 dev，生产没这项=默认 false=旁路不进过滤器链）=====
scuplus:
  test:
    user-bypass: true   # true = 注册 X-Test-UserId 旁路过滤器，压测时跳过登录
